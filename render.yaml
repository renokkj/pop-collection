# Publicação da API no Render (plano gratuito). O site continua no GitHub Pages.
# Os segredos (sync: false) são preenchidos no painel do Render, nunca aqui.
services:
  - type: web
    name: pop-collection-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    # só publica de novo quando algo muda na API
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://giimoieqyosmklpdhhfn.supabase.co
